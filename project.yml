name: Unpackd
options:
  bundleIdPrefix: com.hoamedigital
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  KeyboardKit:
    url: https://github.com/KeyboardKit/KeyboardKit
    from: "10.7.3"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Your ORG's 10-char team ID (Apple Developer > Membership), not a
    # personal team. Uploading to App Store Connect from a personal team is
    # impossible, so a wrong value here fails at Distribute, not at build.
    DEVELOPMENT_TEAM: "8SZ8KXAYPB"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # Must be unique per upload. App Store Connect rejects a build number it
    # has already seen, even if the archive differs — bump for every upload.
    CURRENT_PROJECT_VERSION: "4"

targets:
  Unpackd:
    type: application
    platform: iOS
    sources:
      - path: Unpackd
      # "Unpack later" is written by the keyboard and read by the app, so the
      # model and its store are compiled into both targets — the same approach
      # Typography.swift takes below, for the same reason: a shared framework
      # for two small types costs more than compiling one file twice.
      # `SavedMoment+Unpack.swift` is deliberately NOT here; it bridges the
      # keyboard's flow types, which the app has no business knowing about.
      - path: UnpackdKeyboard/Reflect/SavedMoment.swift
      - path: UnpackdKeyboard/Reflect/SavedMomentStore.swift
      # "Remember" runs the other way round: the APP authors these thoughts
      # and the keyboard only reads them. Shared for the same reason.
      - path: UnpackdKeyboard/Reflect/RememberedThought.swift
      # Inter, for the app's UI type. Shared with the extension rather than
      # duplicated into each target's folder: an app extension cannot read
      # its container app's bundle, so both need their own copy of the files,
      # but there is no reason for two copies in the repo.
      #
      # This MUST be a `sources` entry with an explicit `buildPhase`, not a
      # top-level `resources:` key — XcodeGen has no such key and silently
      # ignores it, producing a project with no reference to the fonts at all.
      # That failure is invisible: the build succeeds, the files are simply
      # absent from the bundle, and every `Font.custom` falls back to San
      # Francisco. Verify with `ls Unpackd.app/*.ttf` after building, not by
      # the build succeeding.
      #
      # `optional: true` so a checkout without the .ttf files still builds.
      - path: Resources/Fonts
        buildPhase: resources
        optional: true
        excludes: ["README.md"]
    dependencies:
      - target: UnpackdKeyboard
        embed: true
      - package: KeyboardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoamedigital.unpackd
        # iPhone only (1). A universal build must declare all four
        # orientations for iPad multitasking, which App Store Connect
        # enforces (error 90474) — and this app is portrait-only by design.
        # Foundation Models also needs an iPhone 15 Pro or newer, so iPad
        # was never a target.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Unpackd/Info.plist
        CODE_SIGN_ENTITLEMENTS: Unpackd/Unpackd.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  UnpackdKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: UnpackdKeyboard
      # Typography is compiled into BOTH targets rather than duplicated. The
      # PostScript face names are the one thing here that fails silently when
      # the font files change, so a second copy in the extension is a second
      # place to forget. Compiling the file twice is cheap; the alternative is
      # a shared framework for one table.
      - path: Unpackd/Typography.swift
      # The extension needs its own copy of the FONTS — see the note on the
      # app target,
      # including why this is a `sources` entry and not `resources:`. Here it
      # is only the spacebar wordmark that uses Inter; the panel and keys stay
      # on the system font deliberately (see SpacebarWordmark).
      - path: Resources/Fonts
        buildPhase: resources
        optional: true
        excludes: ["README.md"]
    dependencies:
      - package: KeyboardKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hoamedigital.unpackd.keyboard
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: UnpackdKeyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: UnpackdKeyboard/UnpackdKeyboard.entitlements
